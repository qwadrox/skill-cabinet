name: Release macOS app

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Set the SPARKLE_PRIVATE_KEY repository secret before publishing a release.' >&2
            exit 1
          fi

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must have the form v1.2.3.' >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release app
        run: flutter build macos --release --build-name="${RELEASE_TAG#v}" --build-number="$GITHUB_RUN_NUMBER"

      - name: Package universal DMG
        shell: bash
        run: |
          app='build/macos/Build/Products/Release/Skill Cabinet.app'
          lipo "$app/Contents/MacOS/Skill Cabinet" -verify_arch arm64 x86_64
          mkdir -p dist
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/pip" install dmgbuild==1.6.7
          swift tool/dmg/background.swift "$RUNNER_TEMP/dmg-background.tiff"
          "$RUNNER_TEMP/dmg-tools/bin/dmgbuild" \
            -s tool/dmg/settings.py \
            -D app="$app" -D background="$RUNNER_TEMP/dmg-background.tiff" \
            'Skill Cabinet' "dist/Skill-Cabinet-${RELEASE_TAG}-macos-universal.dmg"

      - name: Prepare GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          macOS universal build (Apple Silicon and Intel).

          This app is not signed with an Apple Developer ID or notarized. If macOS blocks it, try opening it once, then go to System Settings → Privacy & Security → Open Anyway.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Skill Cabinet $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --generate-notes
          fi

          gh release view "$RELEASE_TAG" --json body --jq .body > "dist/Skill-Cabinet-${RELEASE_TAG}-macos-universal.md"

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sparkle"
          curl --fail --location --silent --show-error \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --embed-release-notes \
            --maximum-deltas 0 \
            dist
          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          enclosure = ET.parse('dist/appcast.xml').find('./channel/item/enclosure')
          assert enclosure is not None, 'Appcast has no update'
          assert enclosure.get('{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature'), 'Update is not signed'
          assert enclosure.get('url') == f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/Skill-Cabinet-{os.environ['RELEASE_TAG']}-macos-universal.dmg"
          PYTHON

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/appcast.xml --clobber
          gh release edit "$RELEASE_TAG" --draft=false
